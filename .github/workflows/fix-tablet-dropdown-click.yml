name: Fix tablet dropdown click

on:
  push:
    branches:
      - fix/tablet-dropdown-click
    paths:
      - .github/workflows/fix-tablet-dropdown-click.yml

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tablet-dropdown-click

      - name: Patch dropdown pointer handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "              child: MouseRegion(\n"
              "                onEnter: (_) => _cancelCloseTimer(),\n"
              "                onExit: (_) => _scheduleClose(),\n",
              "              child: MouseRegion(\n"
              "                onEnter: (event) {\n"
              "                  if (event.kind == PointerDeviceKind.mouse) {\n"
              "                    _cancelCloseTimer();\n"
              "                  }\n"
              "                },\n"
              "                onExit: (event) {\n"
              "                  if (event.kind == PointerDeviceKind.mouse) {\n"
              "                    _scheduleClose();\n"
              "                  }\n"
              "                },\n",
          )

          replace_once(
              "      child: MouseRegion(\n"
              "        onEnter: (_) {\n"
              "          _cancelCloseTimer();\n"
              "          _insertOverlay();\n"
              "        },\n"
              "        onExit: (_) => _scheduleClose(),\n",
              "      child: MouseRegion(\n"
              "        onEnter: (event) {\n"
              "          if (event.kind != PointerDeviceKind.mouse) return;\n"
              "          _cancelCloseTimer();\n"
              "          _insertOverlay();\n"
              "        },\n"
              "        onExit: (event) {\n"
              "          if (event.kind == PointerDeviceKind.mouse) {\n"
              "            _scheduleClose();\n"
              "          }\n"
              "        },\n",
          )

          replace_once(
              "              child: widget.trigger,\n",
              "              // The wrapper owns pointer interaction. This prevents a nested\n"
              "              // trigger button (for example Products) from navigating on an\n"
              "              // accidental desktop click while still allowing tap to open the\n"
              "              // dropdown on touch/tablet layouts.\n"
              "              child: IgnorePointer(child: widget.trigger),\n",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart
          git commit -m "Fix dropdown click behavior on tablets"
          git push origin HEAD:fix/tablet-dropdown-click
