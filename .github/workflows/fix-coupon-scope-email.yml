name: Verify coupon scope and email fix

on:
  push:
    branches:
      - fix/coupon-scope-email-compose
    paths:
      - .github/workflows/fix-coupon-scope-email.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coupon-scope-email-compose

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze changed Flutter files
        run: flutter analyze lib/features/admin/presentation/screens/admin_promotion_codes_screen.dart lib/services/commerce_admin_service.dart

      - name: Verify Cloud Functions build and tests
        working-directory: functions
        run: |
          npm ci
          npm test
