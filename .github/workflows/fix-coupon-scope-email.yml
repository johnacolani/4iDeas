name: Apply coupon scope and email fix

on:
  push:
    branches:
      - fix/coupon-scope-email-compose
    paths:
      - .github/workflows/fix-coupon-scope-email.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coupon-scope-email-compose

      - name: Apply focused source changes
        run: python3 .github/scripts/apply_coupon_fix.py

      - name: Verify Cloud Functions build and tests
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/src/stripe/promotions.ts lib/services/commerce_admin_service.dart lib/features/admin/presentation/screens/admin_promotion_codes_screen.dart
          git commit -m "Fix promotion scope labels and email compose"
          git push origin HEAD:fix/coupon-scope-email-compose
